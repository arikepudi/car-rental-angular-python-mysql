<div class="auth-card card">
  <h1>Sign in</h1>

  <div class="field">
    <label for="email">Email</label>
    <input id="email" type="email" [ngModel]="email()" (ngModelChange)="email.set($event)" />
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input id="password" type="password" [ngModel]="password()" (ngModelChange)="password.set($event)" />
  </div>

  @if (errorMessage()) {
    <p class="error-text">{{ errorMessage() }}</p>
  }

  <button class="btn full" type="button" [disabled]="submitting()" (click)="submit()">
    {{ submitting() ? 'Signing in…' : 'Sign in' }}
  </button>

  <p class="switch">No account? <a routerLink="/signup">Sign up</a></p>
</div>
